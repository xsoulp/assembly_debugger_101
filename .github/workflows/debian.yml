name: Debian package and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/workflows/debian.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asm101-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and debugger dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev nasm binutils gdb gh desktop-file-utils
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Build Debian package
        run: ./packaging/build-deb.sh
      - name: Install and launch the package
        run: |
          install_dir=$(mktemp -d /tmp/asm101-install.XXXXXX)
          chmod 755 "$install_dir"
          install -m 644 dist/*.deb "$install_dir/"
          sudo apt-get install -y "$install_dir"/*.deb
          desktop-file-validate /usr/share/applications/asm101.desktop
          set +e
          QT_QPA_PLATFORM=offscreen timeout 3s asm101
          status=$?
          set -e
          test "$status" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: asm101-debian
          path: |
            dist/*.deb
            dist/SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^project(ASM101 VERSION \([^ ]*\) LANGUAGES CXX).*$/\1/p' CMakeLists.txt)
          test -n "$version"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          git rev-parse --verify "refs/tags/$tag"
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "ASM101 $tag" --notes-file packaging/release-notes.md
          else
            gh release edit "$tag" --title "ASM101 $tag" --notes-file packaging/release-notes.md
          fi
          gh release upload "$tag" dist/*.deb dist/SHA256SUMS --clobber
